<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>CRAZY LEGENDARY HOMEWORK!!!</title>
</head>
<body>
    <main>
        <p class="welcome">Login<br>Welcome back!</p>
        <form>
            <input class="username" type="text" placeholder="Enter Your Username / Email">
            <input class="password" type="password" placeholder="Enter Your Password">
        </form>
        <p class="forgot"><a>Forgot password?</a></p>
        <button class="login">Login</button>
        <p class="sign_up">Don't have an account?<a>Signup</a></p>
        <div class="or">
            <hr>
            <span>Or</span>
            <hr>
        </div>
        <button class="facebook">
            <img src="img/facebook logo.svg" alt="facebook logo">
            <span>Login with Facebook</span>
        </button>
        <button class="google">
            <img src="img/google logo.svg" alt="google logo">
            <span>Login with Google</span>
        </button>
    </main>
</body>
</html>
